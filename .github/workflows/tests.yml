# The test-suite (`make test`, see the Makefile) on every pull request and on main.
# Python 3.13 as in the add-on's base image (build.yaml: base-python:3.13-alpine3.21); gawk because the
# add-on ships GNU awk and claudecode-start's Remote Control log filter uses its systime(); tmux for
# the claude-login-url tests. Read-only:
# nothing here can push, comment or publish. A pull request from a fork may wait for a maintainer's
# approval before its first run (GitHub's default for outside contributors).
# ubuntu-24.04, not ubuntu-latest: that label moved to 26.04, whose `timeout` is the Rust coreutils one.
# It exits 124 when it is sent SIGTERM itself; GNU timeout, which the add-on image ships (apk coreutils)
# and the job runner's exit-code table is written for, dies of the signal (143). Two test_runner abort
# tests failed on 26.04 for that reason alone.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tools the tests call
        run: sudo apt-get update -q && sudo apt-get install -y -q gawk tmux
      - name: make test
        run: make test
