name: Claude Code
description: Run Claude Code AI assistant inside Home Assistant to create automations, debug issues, and manage your smart home configuration
version: "1.2.65-con.16"
slug: claudecode
url: https://github.com/con-ant/hass-addons
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
# Seconds the Supervisor waits after SIGTERM before killing the container.
# claudecode-start signals in-flight job runs first, hands a running Claude a
# SIGTERM and waits up to STOP_GRACE_SECS (10), reaps job runs
# (JOB_STOP_GRACE_SECS, 5), then tears down tmux and ttyd: <= 27 s worst case
# (docs/DESIGN-claude-jobs.md Appendix A.1). The default 10 is too tight.
timeout: 30
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:brain
panel_title: Claude Code
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: manager
docker_api: true
full_access: true
map:
  - homeassistant_config:rw
  - ssl:ro
  - share:rw
  - media:rw
  - addon_config:rw
  - backup:ro
options:
  enable_mcp: true
  enable_playwright_mcp: false
  playwright_cdp_host: ""
  terminal_font_size: 14
  terminal_theme: dark
  working_directory: /homeassistant
  session_persistence: true
  auto_update_claude: false
  default_permission_mode: auto
  auto_launch_claude: continue
  enable_remote_control: false
  remote_control_session_prefix: HomeAssistant
  extra_npm_packages: []
  job_default_model: opus
  enable_job_endpoint: false
  debug_logging: false
schema:
  enable_mcp: bool
  enable_playwright_mcp: bool
  playwright_cdp_host: str?
  terminal_font_size: int(10,24)
  terminal_theme: list(dark|light)
  working_directory: str
  session_persistence: bool
  auto_update_claude: bool
  default_permission_mode: list(default|auto|acceptEdits|plan|bypassPermissions)
  auto_launch_claude: list(off|new|continue)
  enable_remote_control: bool
  remote_control_session_prefix: str
  extra_npm_packages:
    - str?
  job_default_model: list(fable|opus|sonnet|haiku)
  enable_job_endpoint: bool
  debug_logging: bool
environment:
  TERM: xterm-256color
