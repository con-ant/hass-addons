configuration:
  enable_mcp:
    name: Activer Home Assistant MCP
    description: >-
      Activez le serveur Home Assistant MCP pour l'interaction directe avec les
      entités et les services à partir de Claude Code. Permet à Claude de
      interroger les états, d'appeler des services et d'interagir avec votre
      maison intelligente.
  enable_playwright_mcp:
    name: Activer Playwright MCP
    description: >-
      Activez le serveur Playwright MCP pour l'automatisation du navigateur.
      Nécessite que le module complémentaire "Playwright Browser" soit installé
      et en cours d'exécution. Permet à Claude de naviguer sur les pages web,
      de remplir les formulaires, de cliquer sur les éléments et de prendre
      des captures d'écran.
  playwright_cdp_host:
    name: Hôte Playwright CDP
    description: >-
      Nom d'hôte du module complémentaire Playwright Browser pour la connexion
      CDP. Laissez vide pour le défaut (playwright-browser). Si la connexion
      échoue, vérifiez le nom d'hôte du conteneur Playwright Browser
      (par exemple, 1016f397-playwright-browser).
  terminal_font_size:
    name: Taille de la Police du Terminal
    description: >-
      Taille de la police pour le terminal web en pixels (10-24).
      Ajustez pour une meilleure lisibilité sur votre affichage.
  terminal_theme:
    name: Thème du Terminal
    description: >-
      Thème de couleur pour le terminal web.
      Choisissez « dark » pour les fonds sombres ou « light » pour les fonds clairs.
  working_directory:
    name: Répertoire de Travail
    description: >-
      Le répertoire de travail par défaut au démarrage de Claude Code.
      Utilisez /homeassistant pour un accès direct aux fichiers de configuration HA.
  session_persistence:
    name: Persistance de Session
    description: >-
      Activez la persistance de la session tmux. Lorsqu'elle est activée, votre
      session de terminal survit aux actualisations du navigateur et aux
      déconnexions. Recommandé pour les tâches longues.
  auto_update_claude:
    name: Mise à Jour Automatique de Claude Code
    description: >-
      Vérifiez et installez automatiquement les mises à jour de Claude Code au
      démarrage du module complémentaire. Garde Claude Code à jour sans nécessiter
      de changements de version du module complémentaire.
  enable_remote_control:
    name: Activer le Contrôle à Distance
    description: >-
      Démarre Claude Code avec le Contrôle à Distance activé pour voir et
      diriger la session depuis claude.ai/code ou l'application mobile Claude.
      Nécessite un abonnement claude.ai Pro, Max, Team ou Enterprise (les clés
      API ne sont pas prises en charge). Note de sécurité : ce module
      complémentaire s'exécute en tant que root avec un accès complet à votre
      hôte Home Assistant ; quiconque peut se connecter au compte Claude lié
      peut donc le contrôler. Laissez cette option désactivée sauf si vous en
      avez besoin.
  remote_control_session_prefix:
    name: Préfixe du Nom de Session du Contrôle à Distance
    description: >-
      Préfixe des noms de session de Contrôle à Distance générés automatiquement,
      visibles sur claude.ai/code et dans l'application mobile Claude. La valeur
      par défaut est « HomeAssistant », produisant des noms comme
      « HomeAssistant-graceful-unicorn ». S'applique uniquement lorsque le
      Contrôle à Distance est activé.

  job_default_model:
    name: Modèle par défaut des tâches planifiées
    description: >-
      Alias du modèle utilisé par les Claude Jobs (~/.claude/jobs/*.md) qui ne définissent pas model: eux-mêmes. fable est le plus capable et le plus coûteux ; une tâche peut fixer un modèle moins cher dans son frontmatter.
  enable_job_endpoint:
    name: Activer le point d'accès des tâches
    description: >-
      Permet à Home Assistant de déclencher les Claude Jobs : démarre un point d'accès HTTP sur le port 7682 (réseau interne des add-ons uniquement, jeton dans /data/claude-jobs/token ; voir `claude-job token show`) et écrit le paquet claudecode_jobs.yaml dans votre répertoire de configuration à chaque démarrage. Désactivé = les tâches ne se lancent que depuis le terminal.
  enable_usage_sensors:
    name: Capteurs d'utilisation de l'abonnement Claude
    description: >-
      Avec le point d'accès des tâches actif, interroge les limites de votre forfait claude.ai (session de 5 heures, hebdomadaire, hebdomadaire par modèle, utilisation supplémentaire, répartition hebdomadaire par surface) toutes les usage_poll_interval secondes et les expose comme sensor.claude_usage_* dans le paquet généré. Chiffres du compte entier ; le jeton de connexion est seulement lu, jamais renouvelé, donc sur une installation inactive les valeurs peuvent devenir périmées (binary_sensor.claude_usage_stale).
  usage_poll_interval:
    name: Intervalle d'interrogation de l'utilisation (secondes)
    description: >-
      Fréquence à laquelle l'add-on demande les chiffres d'utilisation à api.anthropic.com et à laquelle Home Assistant les relit auprès de l'add-on. 60-3600 ; 300 par défaut.
  usage_keepalive_job:
    name: Tâche de maintien du jeton (optionnel)
    description: >-
      Nom d'une tâche (p. ex. usage-keepalive, fournie) que le point d'accès lance au plus une fois par heure tant que le jeton d'accès claude.ai est expiré, afin que la CLI elle-même le renouvelle et que les capteurs d'utilisation restent à jour. Coûte un petit appel au modèle par exécution. Vide = désactivé.
  debug_logging:
    name: Journalisation de débogage au démarrage
    description: >-
      Trace chaque commande du script de démarrage de l'add-on dans le journal
      de l'add-on (bash -x) avec horodatage. À activer quand l'add-on ne démarre
      pas sans que le journal en donne la raison, puis à désactiver - le journal
      devient très verbeux.
network:
  7681/tcp: Terminal Web (ttyd)
