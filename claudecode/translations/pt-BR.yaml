configuration:
  enable_mcp:
    name: Habilitar MCP do Home Assistant
    description: >-
      Habilita o servidor MCP do Home Assistant para interação direta com
      entidades e serviços pelo Claude Code. Permite que o Claude consulte
      estados, chame serviços e interaja com sua casa inteligente.
  enable_playwright_mcp:
    name: Habilitar MCP Playwright
    description: >-
      Habilita o servidor MCP Playwright para automação de navegador. Requer o
      add-on "Playwright Browser" instalado e em execução. Permite que o Claude
      navegue em páginas web, preencha formulários, clique em elementos e tire
      screenshots.
  playwright_cdp_host:
    name: Host CDP do Playwright
    description: >-
      Nome do host do add-on Playwright Browser para conexão CDP. Deixe vazio
      para o padrão (playwright-browser). Se a conexão falhar, verifique o
      nome do host do container Playwright Browser (ex: 1016f397-playwright-browser).
  terminal_font_size:
    name: Tamanho da Fonte do Terminal
    description: >-
      Tamanho da fonte do terminal web em pixels (10-24).
      Ajuste para melhor legibilidade no seu monitor.
  terminal_theme:
    name: Tema do Terminal
    description: >-
      Tema de cores do terminal web.
      Escolha 'dark' para fundo escuro ou 'light' para fundo claro.
  working_directory:
    name: Diretório de Trabalho
    description: >-
      O diretório padrão quando o Claude Code inicia.
      Use /homeassistant para acesso direto aos arquivos de configuração do HA.
  session_persistence:
    name: Persistência de Sessão
    description: >-
      Habilita persistência de sessão via tmux. Quando habilitado, sua sessão
      do terminal sobrevive a atualizações do navegador e desconexões.
      Recomendado para tarefas de longa duração.
  auto_update_claude:
    name: Atualização Automática do Claude Code
    description: >-
      Verifica e instala automaticamente atualizações do Claude Code ao iniciar o add-on.
      Mantém o Claude Code atualizado sem precisar atualizar a versão do add-on.
  enable_remote_control:
    name: Habilitar Controle Remoto
    description: >-
      Inicia o Claude Code com Controle Remoto habilitado para ver e dirigir a
      sessão a partir de claude.ai/code ou do app móvel do Claude. Requer uma
      assinatura claude.ai Pro, Max, Team ou Enterprise (chaves de API não são
      suportadas). Nota de segurança: este add-on roda como root com acesso
      completo ao seu host Home Assistant, então qualquer pessoa que consiga
      entrar na conta Claude vinculada pode controlá-lo. Deixe desativado a
      menos que precise.
  remote_control_session_prefix:
    name: Prefixo do Nome de Sessão do Controle Remoto
    description: >-
      Prefixo para os nomes de sessão de Controle Remoto gerados automaticamente,
      visíveis em claude.ai/code e no app móvel do Claude. O padrão é
      "HomeAssistant", produzindo nomes como "HomeAssistant-graceful-unicorn".
      Aplica-se apenas quando o Controle Remoto está habilitado.

  job_default_model:
    name: Modelo padrão para jobs agendados
    description: >-
      Alias do modelo usado pelos Claude Jobs (~/.claude/jobs/*.md) que não definem model: por conta própria. fable é o mais capaz e o mais caro; um job pode fixar um modelo mais barato no próprio frontmatter.
  enable_job_endpoint:
    name: Ativar o endpoint de jobs
    description: >-
      Permite que o Home Assistant dispare os Claude Jobs: inicia um endpoint HTTP na porta 7682 (apenas rede interna de add-ons, token em /data/claude-jobs/token; veja `claude-job token show`) e grava o pacote claudecode_jobs.yaml no seu diretório de configuração a cada inicialização. Desativado = os jobs só rodam pelo terminal.
  enable_usage_sensors:
    name: Sensores de uso da assinatura Claude
    description: >-
      Com o endpoint de jobs ativo, consulta os limites do seu plano claude.ai (sessão de 5 horas, semanal, semanal por modelo, uso extra, detalhamento semanal por superfície) a cada usage_poll_interval segundos e os expõe como sensor.claude_usage_* no pacote gerado. Números da conta inteira; o token de login é apenas lido, nunca renovado, então em uma instalação ociosa os valores podem ficar desatualizados (binary_sensor.claude_usage_stale).
  usage_poll_interval:
    name: Intervalo de consulta de uso (segundos)
    description: >-
      Com que frequência o add-on pede os números de uso à api.anthropic.com e o Home Assistant os consulta no add-on. 60-3600; padrão 300.
  usage_keepalive_job:
    name: Job de manutenção do token (opcional)
    description: >-
      Nome de um job (ex. usage-keepalive, incluído) que o endpoint executa no máximo uma vez por hora enquanto o token de acesso do claude.ai estiver expirado, para que a própria CLI o renove e os sensores de uso continuem atualizados. Custa uma pequena chamada ao modelo por execução. Vazio = desativado.
  debug_logging:
    name: Log de depuração da inicialização
    description: >-
      Registra cada comando do script de inicialização do add-on no log do
      add-on (bash -x) com carimbos de hora. Ative quando o add-on falha ao
      iniciar e o log não diz o porquê, e desative depois - o log fica muito
      verboso.
network:
  7681/tcp: Terminal Web (ttyd)
