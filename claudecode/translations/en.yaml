configuration:
  enable_mcp:
    name: Enable Home Assistant MCP
    description: >-
      Enable the Home Assistant MCP server for direct entity and service
      interaction from Claude Code. Allows Claude to query states, call services,
      and interact with your smart home.
  enable_playwright_mcp:
    name: Enable Playwright MCP
    description: >-
      Enable the Playwright MCP server for browser automation. Requires the
      "Playwright Browser" add-on to be installed and running. Allows Claude to
      navigate web pages, fill forms, click elements, and take screenshots.
  playwright_cdp_host:
    name: Playwright CDP Host
    description: >-
      Hostname of the Playwright Browser add-on for CDP connection. Leave empty
      for default (playwright-browser). If connection fails, check the Playwright
      Browser container hostname (e.g., 1016f397-playwright-browser).
  terminal_font_size:
    name: Terminal Font Size
    description: >-
      Font size for the web terminal in pixels (10-24).
      Adjust for readability on your display.
  terminal_theme:
    name: Terminal Theme
    description: >-
      Color theme for the web terminal.
      Choose 'dark' for dark backgrounds or 'light' for light backgrounds.
  working_directory:
    name: Working Directory
    description: >-
      The default working directory when Claude Code starts.
      Use /homeassistant for direct access to HA configuration files.
  session_persistence:
    name: Session Persistence
    description: >-
      Enable tmux session persistence. When enabled, your terminal session
      survives browser refreshes and disconnects. Recommended for long-running tasks.
  auto_update_claude:
    name: Auto-update Claude Code
    description: >-
      Automatically check for and install Claude Code updates on add-on startup.
      Keeps Claude Code current without requiring add-on version bumps.
  enable_remote_control:
    name: Enable Remote Control
    description: >-
      Start Claude Code with Remote Control enabled so you can view and steer
      the session from claude.ai/code or the Claude mobile app. Requires a
      claude.ai Pro, Max, Team, or Enterprise subscription (API keys are not
      supported). Security note: this add-on runs as root with full access to
      your Home Assistant host, so anyone who can sign in to the linked Claude
      account can control it. Leave this off unless you need it.
  remote_control_session_prefix:
    name: Remote Control Session Name Prefix
    description: >-
      Prefix for auto-generated Remote Control session names visible in claude.ai/code
      and the Claude mobile app. Defaults to "HomeAssistant", producing names like
      "HomeAssistant-graceful-unicorn". Only applies when Enable Remote Control is on.

  job_default_model:
    name: Default model for scheduled jobs
    description: >-
      Model alias used by Claude Jobs (~/.claude/jobs/*.md) that do not set model: themselves. fable is the most capable and most expensive; a job can pin a cheaper model in its own frontmatter.
  enable_job_endpoint:
    name: Enable the job trigger endpoint
    description: >-
      Let Home Assistant trigger Claude Jobs: starts an HTTP endpoint on port 7682 (add-on network only, bearer token in /data/claude-jobs/token; see `claude-job token show`) and writes the claudecode_jobs.yaml package into your config directory at every start. Off = jobs can still be run from the terminal.
  enable_usage_sensors:
    name: Claude subscription usage sensors
    description: >-
      With the job endpoint on, poll your claude.ai plan limits (5-hour session, weekly, weekly per-model, extra usage, weekly breakdown by surface) every usage_poll_interval seconds and expose them as sensor.claude_usage_* in the generated package. Whole-account figures; the login token is only read, never refreshed, so on an idle install the values can go stale (binary_sensor.claude_usage_stale).
  usage_poll_interval:
    name: Usage poll interval (seconds)
    description: >-
      How often the add-on asks api.anthropic.com for the usage figures and how often Home Assistant polls the add-on for them. 60-3600; default 300.
  usage_keepalive_job:
    name: Usage keepalive job (optional)
    description: >-
      Name of a job (e.g. usage-keepalive, shipped) the endpoint runs at most once an hour while the claude.ai access token has expired, so the CLI itself renews it and the usage sensors stay fresh. Costs one small model call per run. Empty = off.
  debug_logging:
    name: Debug startup logging
    description: >-
      Trace every command of the add-on's startup script into the add-on log
      (bash -x) with timestamps. Turn this on when the add-on fails to boot and
      the log does not say why, then turn it off again - the log gets very
      verbose.
network:
  7681/tcp: Web Terminal (ttyd)
