configuration:
  enable_mcp:
    name: Habilitar MCP de Home Assistant
    description: >-
      Habilita el servidor MCP de Home Assistant para interacción directa con
      entidades y servicios desde Claude Code. Permite que Claude consulte
      estados, llame servicios e interactúe con tu hogar inteligente.
  enable_playwright_mcp:
    name: Habilitar MCP Playwright
    description: >-
      Habilita el servidor MCP Playwright para automatización del navegador. Requiere
      el add-on "Playwright Browser" instalado y ejecutándose. Permite que Claude
      navegue páginas web, complete formularios, haga clic en elementos y tome
      capturas de pantalla.
  playwright_cdp_host:
    name: Host CDP de Playwright
    description: >-
      Nombre del host del add-on Playwright Browser para conexión CDP. Deja vacío
      para el predeterminado (playwright-browser). Si la conexión falla, verifica el
      nombre del host del contenedor Playwright Browser (ej: 1016f397-playwright-browser).
  terminal_font_size:
    name: Tamaño de Fuente del Terminal
    description: >-
      Tamaño de fuente del terminal web en píxeles (10-24).
      Ajusta para mejor legibilidad en tu pantalla.
  terminal_theme:
    name: Tema del Terminal
    description: >-
      Tema de colores del terminal web.
      Elige 'dark' para fondo oscuro o 'light' para fondo claro.
  working_directory:
    name: Directorio de Trabajo
    description: >-
      El directorio predeterminado cuando Claude Code inicia.
      Usa /homeassistant para acceso directo a los archivos de configuración de HA.
  session_persistence:
    name: Persistencia de Sesión
    description: >-
      Habilita persistencia de sesión via tmux. Cuando está habilitado, tu sesión
      del terminal sobrevive a actualizaciones del navegador y desconexiones.
      Recomendado para tareas de larga duración.
  auto_update_claude:
    name: Actualización Automática de Claude Code
    description: >-
      Verifica e instala automáticamente actualizaciones de Claude Code al iniciar el add-on.
      Mantiene Claude Code actualizado sin necesidad de actualizar la versión del add-on.
  apply_claude_updates:
    name: Aplicar actualizaciones de Claude Code
    description: >-
      Claude Code instala sus propias actualizaciones en segundo plano, pero una
      sesión en curso sigue con la versión anterior hasta que se reinicia. Con
      esta opción, una sesión inactiva (sin turno en curso y sin actividad
      durante 15 minutos) se reinicia con la actualización instalada y retoma la
      misma conversación. Requiere persistencia de sesión e inicio automático.
  claude_update_channel:
    name: Canal de actualización de Claude Code
    description: >-
      Qué versiones de Claude Code sigue este complemento. stable suele ir
      una semana por detrás de la versión más reciente y omite las versiones
      con regresiones graves; latest recibe cada versión en cuanto se publica.
      Se aplica a las actualizaciones en segundo plano de Claude Code, a la
      actualización al arrancar (auto_update_claude) y a la versión que se
      recupera tras un reinicio.
  default_permission_mode:
    name: Modo de permisos predeterminado
    description: >-
      Lo que Claude Code puede hacer sin preguntar. auto deja que un clasificador
      apruebe o rechace cada solicitud (requiere un plan Max, Team, Enterprise o
      API; si no, vuelve a default). default pregunta siempre, acceptEdits
      aprueba las ediciones de archivos, plan solo planifica y
      bypassPermissions lo aprueba todo.
  auto_launch_claude:
    name: Iniciar Claude automáticamente
    description: >-
      Lo que ejecuta el terminal web. continue retoma la última conversación,
      new empieza una nueva y off da un intérprete de comandos. Con Remote
      Control activado, la sesión se inicia al arrancar el add-on, sin esperar
      a un navegador.
  extra_npm_packages:
    name: Paquetes npm adicionales
    description: >-
      Paquetes npm, como servidores MCP, que se instalan en cada inicio en una
      carpeta persistente del volumen de Home Assistant, por lo que sobreviven a
      las actualizaciones del add-on. Sus comandos están en el PATH.
  enable_remote_control:
    name: Habilitar Control Remoto
    description: >-
      Inicia Claude Code con Control Remoto habilitado para ver y dirigir la
      sesión desde claude.ai/code o la app móvil de Claude. Requiere una
      suscripción claude.ai Pro, Max, Team o Enterprise (las claves API no son
      compatibles). Nota de seguridad: este add-on se ejecuta como root con
      acceso completo a tu host de Home Assistant, por lo que cualquiera que
      pueda iniciar sesión en la cuenta de Claude vinculada puede controlarlo.
      Déjalo desactivado a menos que lo necesites.
  remote_control_session_prefix:
    name: Prefijo del Nombre de Sesión de Control Remoto
    description: >-
      Prefijo para los nombres de sesión de Control Remoto generados automáticamente,
      visibles en claude.ai/code y la app móvil de Claude. El predeterminado es
      "HomeAssistant", produciendo nombres como "HomeAssistant-graceful-unicorn".
      Con el servidor de Control Remoto activado, también es el título de la
      sesión propia del servidor. Aplica cuando Control Remoto o el servidor de
      Control Remoto está habilitado.

  remote_control_server:
    name: Servidor de Remote Control
    description: >-
      Ejecuta también un servidor de Remote Control de Claude Code, para iniciar
      sesiones nuevas en este equipo desde claude.ai/code o la app de Claude, no
      solo controlar la sesión del terminal. Requiere iniciar sesión con
      claude.ai (no una clave de API) y un plan Pro, Max, Team o Enterprise.
      Las sesiones nuevas trabajan en /homeassistant con el modo de permisos
      predeterminado.
  job_default_model:
    name: Modelo predeterminado para trabajos programados
    description: >-
      Alias del modelo que usan los Claude Jobs (~/.claude/jobs/*.md) que no definen model: por sí mismos. fable es el más capaz y el más caro; cada trabajo puede fijar un modelo más barato en su frontmatter.
  enable_job_endpoint:
    name: Activar el endpoint de trabajos
    description: >-
      Permite que Home Assistant dispare los Claude Jobs: inicia un endpoint HTTP en el puerto 7682 (solo red interna de add-ons, token en /data/claude-jobs/token; ver `claude-job token show`) y escribe el paquete claudecode_jobs.yaml en tu directorio de configuración en cada arranque. Desactivado = los trabajos solo se ejecutan desde la terminal.
  enable_usage_sensors:
    name: Sensores de uso de la suscripción Claude
    description: >-
      Con el endpoint de trabajos activo, consulta los límites de tu plan claude.ai (sesión de 5 horas, semanal, semanal por modelo, uso extra, desglose semanal por superficie) cada usage_poll_interval segundos y los expone como sensor.claude_usage_* en el paquete generado. Cifras de toda la cuenta; el token de sesión solo se lee, nunca se renueva, así que en una instalación inactiva los valores pueden quedar obsoletos (binary_sensor.claude_usage_stale).
  usage_poll_interval:
    name: Intervalo de consulta de uso (segundos)
    description: >-
      Cada cuántos segundos el add-on pide las cifras de uso a api.anthropic.com y Home Assistant las consulta al add-on. 60-3600; por defecto 300.
  usage_keepalive_job:
    name: Trabajo de mantenimiento del token (opcional)
    description: >-
      Nombre de un trabajo (p. ej. usage-keepalive, incluido) que el endpoint ejecuta como máximo una vez por hora mientras el token de acceso de claude.ai esté caducado, para que la propia CLI lo renueve y los sensores de uso sigan al día. Cuesta una pequeña llamada al modelo por ejecución. Vacío = desactivado.
  debug_logging:
    name: Registro de depuración del arranque
    description: >-
      Registra cada comando del script de arranque del add-on en el log del
      add-on (bash -x) con marcas de tiempo. Actívalo cuando el add-on no
      arranca y el log no dice por qué, y desactívalo después: el log se vuelve
      muy detallado.
network:
  7681/tcp: Terminal Web (ttyd)
