# The UPS speaks only Modbus RTU; east2nut.service translates it into the file
# below. Verified 2026-11-11 against the real unit: nutdrv_qx sent Q1 six times
# and timed out ("Device not supported!"), and blazer_ser tried Q1, 'D' and the
# zinto protocol and reported "No supported UPS detected".
maxretry = 3

[east]
    driver = dummy-ups
    port = /run/east2nut/east.dev
    mode = dummy-loop
    desc = "EAST EA900 G4 (Intelbras DNB 6kVA)"
